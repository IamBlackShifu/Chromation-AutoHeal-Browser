name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  packaged-windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Exercise packaged record-to-report workflow
        shell: pwsh
        run: |
          $env:CHROMATION_E2E_EXECUTABLE = Join-Path $PWD 'release\win-unpacked\omniflow-qa.exe'
          npm run test:e2e:electron:packaged
      - name: Upload Windows installer and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omniflow-qa-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/OmniFlow-QA-Setup.exe
            ${{ runner.temp }}/chromation-electron-smoke-failure.png
