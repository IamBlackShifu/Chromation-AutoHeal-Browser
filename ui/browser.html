<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromation AutoHeal Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main Browser Container -->
  <div class="browser-container">
    
    <!-- Chrome-style Tab Bar with Draggable Region -->
    <div class="tab-bar" id="title-bar">
      <div class="tabs-container" id="tabs-container">
        <div class="tab active" data-tab-id="1">
          <div class="tab-favicon">🌐</div>
          <div class="tab-title">New Tab</div>
          <button class="tab-close">×</button>
        </div>
      </div>
      <button id="btn-new-tab" class="new-tab-btn" title="New tab">+</button>
      <div class="window-controls">
        <button class="window-btn minimize-btn">−</button>
        <button class="window-btn maximize-btn">□</button>
        <button class="window-btn close-btn">×</button>
      </div>
    </div>
    
    <!-- Top Navigation Bar -->
    <div class="navbar">
      <div class="nav-controls">
        <button id="btn-back" class="nav-btn" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="btn-refresh" class="nav-btn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
        </button>
      </div>

      <!-- Address Bar -->
      <div class="address-bar">
        <div class="security-icon" id="security-icon">🔒</div>
        <input 
          type="text" 
          id="url-input" 
          placeholder="Search Google or type a URL"
          autocomplete="off"
        />
        <div class="loading-indicator" id="loading-indicator"></div>
        <button id="btn-bookmark" class="bookmark-btn" title="Bookmark this page">★</button>
      </div>

      <!-- Menu Button -->
      <div class="tool-controls">
        <button id="btn-menu" class="menu-btn" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="5" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="19" r="1" fill="currentColor"></circle>
          </svg>
        </button>
        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="menu-dropdown hidden">
          <div class="menu-item" id="menu-inspector">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <span>Inspector</span>
            <span class="menu-shortcut">Ctrl+Shift+I</span>
          </div>
          <div class="menu-item" id="menu-recorder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
            </svg>
            <span>Recorder</span>
            <span class="menu-shortcut">Ctrl+Shift+R</span>
          </div>
          <div class="menu-item" id="menu-scraper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>Scraper Studio</span>
            <span class="menu-shortcut">Ctrl+Shift+S</span>
          </div>
          <div class="menu-item" id="menu-healing">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Auto-Healing</span>
            <span class="menu-status">ON</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-recordings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
            </svg>
            <span>Saved Recordings</span>
          </div>
          <div class="menu-item" id="menu-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v5h5"></path>
              <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
            </svg>
            <span>History</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-help">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help</span>
          </div>
          <div class="menu-item" id="menu-update">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
            </svg>
            <span>Check for Updates</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span>System Theme 🔄</span>
          </div>
          <div class="menu-item" id="menu-about">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>About</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Browser View (webview) -->
      <div class="browser-view">
        <webview 
          id="browser-webview" 
          src="about:blank"
          style="width: 100%; height: 100%;"
          partition="persist:chromation"
          allowpopups
          useragent="Chromation-AutoHeal-Browser/1.0"
        ></webview>
      </div>

      <!-- Side Panel for Tools -->
      <div class="side-panel" id="side-panel">
        <div class="panel-header">
          <h3 id="panel-title">Tools</h3>
          <button id="btn-close-panel" class="close-btn">×</button>
        </div>
        <div class="panel-content" id="panel-content">
          <p class="panel-hint">Select a tool from the toolbar to get started</p>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item">
        <span id="status-text">Ready</span>
      </div>
      <div class="status-item">
        <span id="healing-status">🔧 Auto-heal: ON</span>
      </div>
      <div class="status-item">
        <span id="recording-status"></span>
      </div>
    </div>
  </div>

  <!-- Inspector Panel Template -->
  <template id="inspector-panel-template">
    <div class="tool-panel">
      <div class="panel-section">
        <h4 class="panel-heading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          Inspector & Discovery
        </h4>
        <p class="panel-description">Inspect elements and discover page objects</p>
      </div>
      
      <div class="panel-section">
        <div class="button-group">
          <button id="start-inspect-btn" class="primary-btn full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Inspect Element
          </button>
          <button id="discover-all-btn" class="secondary-btn full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Discover All
          </button>
        </div>
      </div>

      <div id="element-info" class="panel-card" style="display: none;">
        <div class="card-header">
          <h5>Element Details</h5>
        </div>
        <div id="element-details" class="card-content"></div>
        <div class="card-header">
          <h5>Generated Locators</h5>
          <span class="badge">Priority Order</span>
        </div>
        <div id="locators-list" class="card-content"></div>
      </div>

      <div id="discovery-results" class="panel-card" style="display: none;">
        <div class="card-header">
          <h5>Discovered Elements</h5>
          <span class="badge badge-count" id="element-count">0</span>
        </div>
        <div class="card-content">
          <div class="form-group">
            <label class="form-label">Export Format</label>
            <select id="pom-framework-select" class="form-select">
              <option value="playwright">Playwright POM</option>
              <option value="selenium-js">Selenium (JavaScript)</option>
              <option value="cypress">Cypress</option>
            </select>
          </div>
          <div class="button-group">
            <button id="export-pom-btn" class="secondary-btn full-width">Export POM</button>
            <button id="export-json-btn" class="secondary-btn full-width">Export JSON</button>
          </div>
        </div>
        <div id="elements-table" class="elements-table"></div>
      </div>
    </div>
  </template>

  <!-- Recorder Panel Template -->
  <template id="recorder-panel-template">
    <div class="tool-panel">
      <div class="panel-section">
        <h4 class="panel-heading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
          </svg>
          Action Recorder
        </h4>
        <p class="panel-description">Record and replay user interactions</p>
      </div>

      <div class="panel-section">
        <div class="button-group">
          <button id="start-record-btn" class="primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
            Start Recording
          </button>
          <button id="stop-record-btn" class="secondary-btn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12"></rect>
            </svg>
            Stop
          </button>
          <button id="replay-record-btn" class="secondary-btn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Replay
          </button>
        </div>
      </div>

      <div class="panel-section">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Mode</label>
            <select id="recording-mode-select" class="form-select">
              <option value="auto">Auto</option>
              <option value="manual">Manual</option>
              <option value="step">Step-by-step</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Replay Speed</label>
            <select id="replay-speed-select" class="form-select">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
              <option value="5">5x</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label">Replay Engine</label>
          <select id="replay-engine-select" class="form-select">
            <option value="webview" selected>In-Browser Replay (fast)</option>
            <option value="playwright">Playwright Executor (evidence-rich)</option>
          </select>
        </div>
        <div class="form-row" style="margin-top: 12px;">
          <div class="form-group">
            <label class="form-label">Step Timeout (ms)</label>
            <input id="replay-timeout-input" class="form-input" type="number" min="1000" step="500" value="8000" />
          </div>
          <div class="form-group">
            <label class="form-label">Retries</label>
            <input id="replay-retries-input" class="form-input" type="number" min="0" step="1" value="1" />
          </div>
        </div>
        <div class="form-group" style="margin-top: 8px;">
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary);">
            <input id="replay-continue-on-failure" type="checkbox" checked />
            Continue on failure
          </label>
        </div>
      </div>

      <div class="panel-card">
        <div class="card-header">
          <h5>Recorded Actions</h5>
          <span class="badge">0</span>
        </div>
        <div id="actions-list" class="actions-list">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
            </svg>
            <p>No actions recorded yet</p>
            <span>Click "Start Recording" to begin</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="form-group">
          <label class="form-label">Script Format</label>
          <select id="export-format-select" class="form-select">
            <option value="playwright">Playwright</option>
            <option value="selenium-js">Selenium (JS)</option>
            <option value="selenium-python">Selenium (Python)</option>
            <option value="cypress">Cypress</option>
            <option value="puppeteer">Puppeteer</option>
          </select>
        </div>
        <button id="export-script-btn" class="secondary-btn full-width">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export Script
        </button>

        <div class="form-group" style="margin-top: 12px;">
          <label class="form-label">Report Format</label>
          <select id="report-format-select" class="form-select">
            <option value="html">HTML</option>
            <option value="json">JSON</option>
            <option value="junit">JUnit XML</option>
            <option value="har">HAR</option>
            <option value="allure">Allure</option>
          </select>
        </div>
        <div class="button-group">
          <button id="export-report-btn" class="secondary-btn full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export Report
          </button>
          <button id="export-all-reports-btn" class="secondary-btn full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="8" cy="8" r="2"></circle>
              <circle cx="16" cy="8" r="2"></circle>
              <circle cx="8" cy="16" r="2"></circle>
              <circle cx="16" cy="16" r="2"></circle>
            </svg>
            All Formats
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Scraper Panel Template -->
  <template id="scraper-panel-template">
    <div class="tool-panel">
      <div class="panel-section">
        <h4 class="panel-heading">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          Scraper Studio
        </h4>
        <p class="panel-description">Extract structured data from web pages</p>
      </div>

      <div class="panel-section">
        <div class="form-group">
          <label class="form-label">CSS Selector</label>
          <input type="text" id="scraper-selector" class="form-input" placeholder="e.g., table, .product-list, #data-grid" />
        </div>
        <button id="start-scrape-btn" class="primary-btn full-width">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Start Scraping
        </button>
      </div>

      <div class="panel-card">
        <div class="card-header">
          <h5>Scraped Data</h5>
          <span class="badge">0 rows</span>
        </div>
        <div id="scraped-data" class="scraped-data">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <p>No data scraped yet</p>
            <span>Enter a CSS selector and click "Start Scraping"</span>
          </div>
        </div>
      </div>

      <div class="panel-section">
        <div class="button-group">
          <button id="export-csv-btn" class="secondary-btn full-width">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            Export CSV
          </button>
        <button id="export-json-btn" class="secondary-btn">Export as JSON</button>
      </div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
