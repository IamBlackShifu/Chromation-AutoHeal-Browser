<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromation AutoHeal Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main Browser Container -->
  <div class="browser-container">
    
    <!-- Chrome-style Tab Bar -->
    <div class="tab-bar">
      <div class="tabs-container" id="tabs-container">
        <div class="tab active" data-tab-id="1">
          <div class="tab-favicon">🌐</div>
          <div class="tab-title">New Tab</div>
          <button class="tab-close">×</button>
        </div>
      </div>
      <button id="btn-new-tab" class="new-tab-btn" title="New tab">+</button>
      <div class="window-controls">
        <button class="window-btn minimize-btn">−</button>
        <button class="window-btn maximize-btn">□</button>
        <button class="window-btn close-btn">×</button>
      </div>
    </div>
    
    <!-- Top Navigation Bar -->
    <div class="navbar">
      <div class="nav-controls">
        <button id="btn-back" class="nav-btn" title="Back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Forward">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="btn-refresh" class="nav-btn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button id="btn-home" class="nav-btn" title="Home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
        </button>
      </div>

      <!-- Address Bar -->
      <div class="address-bar">
        <div class="security-icon" id="security-icon">🔒</div>
        <input 
          type="text" 
          id="url-input" 
          placeholder="Search Google or type a URL"
          autocomplete="off"
        />
        <div class="loading-indicator" id="loading-indicator"></div>
        <button id="btn-bookmark" class="bookmark-btn" title="Bookmark this page">★</button>
      </div>

      <!-- Tool Buttons -->
      <div class="tool-controls">
        <button id="btn-inspector" class="tool-btn" title="Inspector (Ctrl+Shift+I)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
        <button id="btn-recorder" class="tool-btn" title="Recorder (Ctrl+Shift+R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3" fill="currentColor"></circle>
          </svg>
        </button>
        <button id="btn-scraper" class="tool-btn" title="Scraper Studio (Ctrl+Shift+S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </button>
        <button id="btn-healing" class="tool-btn active" title="Auto-Healing ON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        </button>
        <button id="btn-menu" class="menu-btn" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="5" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1" fill="currentColor"></circle>
            <circle cx="12" cy="19" r="1" fill="currentColor"></circle>
          </svg>
        </button>
        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="menu-dropdown hidden">
          <div class="menu-item" id="menu-recordings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
            </svg>
            <span>Saved Recordings</span>
          </div>
          <div class="menu-item" id="menu-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v5h5"></path>
              <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
            </svg>
            <span>History</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-help">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Help</span>
          </div>
          <div class="menu-item" id="menu-update">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"></path>
            </svg>
            <span>Check for Updates</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span>System Theme 🔄</span>
          </div>
          <div class="menu-item" id="menu-about">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>About</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <!-- Browser View (webview) -->
      <div class="browser-view">
        <webview 
          id="browser-webview" 
          src="about:blank"
          style="width: 100%; height: 100%;"
          partition="persist:chromation"
          allowpopups
          useragent="Chromation-AutoHeal-Browser/1.0"
        ></webview>
      </div>

      <!-- Side Panel for Tools -->
      <div class="side-panel" id="side-panel">
        <div class="panel-header">
          <h3 id="panel-title">Tools</h3>
          <button id="btn-close-panel" class="close-btn">×</button>
        </div>
        <div class="panel-content" id="panel-content">
          <p class="panel-hint">Select a tool from the toolbar to get started</p>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item">
        <span id="status-text">Ready</span>
      </div>
      <div class="status-item">
        <span id="healing-status">🔧 Auto-heal: ON</span>
      </div>
      <div class="status-item">
        <span id="recording-status"></span>
      </div>
    </div>
  </div>

  <!-- Inspector Panel Template -->
  <template id="inspector-panel-template">
    <div class="tool-panel">
      <h4>🔍 Element Inspector & Discovery</h4>
      <div class="inspector-modes">
        <button id="start-inspect-btn" class="primary-btn">Inspect Single Element</button>
        <button id="discover-all-btn" class="primary-btn" style="margin-left: 8px;">Discover All Elements</button>
      </div>
      <div id="element-info" class="element-info" style="display: none; margin-top: 16px;">
        <h5>Element Details</h5>
        <div id="element-details"></div>
        <h5>Generated Locators (by priority)</h5>
        <div id="locators-list"></div>
      </div>
      <div id="discovery-results" class="discovery-results" style="display: none; margin-top: 16px;">
        <h5>Discovered Elements (<span id="element-count">0</span>)</h5>
        <div class="export-pom-controls" style="margin: 12px 0;">
          <label>Export as:</label>
          <select id="pom-framework-select">
            <option value="playwright">Playwright POM</option>
            <option value="selenium-js">Selenium (JavaScript)</option>
            <option value="cypress">Cypress</option>
          </select>
          <button id="export-pom-btn" class="secondary-btn">Export POM</button>
          <button id="export-json-btn" class="secondary-btn">Export JSON</button>
        </div>
        <div id="elements-table" class="elements-table"></div>
      </div>
    </div>
  </template>

  <!-- Recorder Panel Template -->
  <template id="recorder-panel-template">
    <div class="tool-panel">
      <h4>Action and Steps Recorder</h4>
      <div class="recorder-controls">
        <button id="start-record-btn" class="primary-btn">Record</button>
        <button id="stop-record-btn" class="secondary-btn" disabled>Stop</button>
        <button id="replay-record-btn" class="secondary-btn" disabled>▶ Replay</button>
      </div>
      <div class="recording-mode">
        <label>Mode:</label>
        <select id="recording-mode-select">
          <option value="auto">Auto</option>
          <option value="manual">Manual</option>
          <option value="step">Step-by-step</option>
        </select>
        <label style="margin-left: 16px;">Replay Speed:</label>
        <select id="replay-speed-select">
          <option value="0.5">0.5x (Slow)</option>
          <option value="1" selected>1x (Normal)</option>
          <option value="2">2x (Fast)</option>
          <option value="5">5x (Very Fast)</option>
        </select>
      </div>
      <div id="actions-list" class="actions-list">
        <p class="hint">No actions recorded yet</p>
      </div>
      <div class="export-controls" style="margin-top: 15px;">
        <label>Export as:</label>
        <select id="export-format-select">
          <option value="playwright">Playwright</option>
          <option value="selenium-js">Selenium (JS)</option>
          <option value="selenium-python">Selenium (Python)</option>
          <option value="cypress">Cypress</option>
          <option value="puppeteer">Puppeteer</option>
        </select>
        <button id="export-script-btn" class="secondary-btn">Export Script</button>
      </div>
    </div>
  </template>

  <!-- Scraper Panel Template -->
  <template id="scraper-panel-template">
    <div class="tool-panel">
      <h4>📊 Scraper Studio</h4>
      <p>Extract data from tables and lists</p>
      <div class="scraper-controls">
        <input type="text" id="scraper-selector" placeholder="CSS Selector (e.g., table)" />
        <button id="start-scrape-btn" class="primary-btn">Start Scraping</button>
      </div>
      <div id="scraped-data" class="scraped-data">
        <p class="hint">No data scraped yet</p>
      </div>
      <div class="export-controls" style="margin-top: 15px;">
        <button id="export-csv-btn" class="secondary-btn">Export as CSV</button>
        <button id="export-json-btn" class="secondary-btn">Export as JSON</button>
      </div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
